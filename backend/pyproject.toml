[project]
name = "jobhunter-ai-backend"
version = "0.1.0"
description = "FastAPI backend for JobHunter AI MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
