services:
  - type: web
    name: jobhunter-ai-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobhunter-ai-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: REQUIRE_HUMAN_CONFIRMATION
        value: "true"

databases:
  - name: jobhunter-ai-db
    plan: free
    databaseName: jobhunter
    user: jobhunter
